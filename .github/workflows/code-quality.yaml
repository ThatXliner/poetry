name: Code Quality

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.cirrus.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '.cirrus.yml'

jobs:
  pre-commit:
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/legacy-build-constraints.txt
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: "3.9"
    - uses: pre-commit/action@v3.0.1
